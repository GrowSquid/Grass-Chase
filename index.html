<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Touch Grass</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        color: #f3ecd2;
        /* background */
        background-color: #309b72;
        background-image: linear-gradient(
            45deg, #103237 25%, transparent 25%, transparent 75%, #103237 75%, #103237
            ),
            linear-gradient(
            135deg, #103237 25%, transparent 25%, transparent 75%, #103237 75%, #103237
            );
        background-size: 60px 60px;
        /* background animation*/
        background-position: 0, 0, 40px, 40px;
        animation: scrolling 18s linear infinite;
    }
    @keyframes scrolling {
        from {background-position: 0 0;}
        to {background-position: 80px 80px;}
        
    }
    header {
        padding: 1rem 1.5rem 0;
        text-align: center;
    }

    h1 {
        margin: 0 0 0.5rem;
    }

    #play-area {
        position: relative;
        min-height: 60vh;
        margin: 1rem;
        border: 4px solid #0f2a1f;
        border-radius: 12px;
        background: #a9c1cf;
        overflow: hidden;
    }

    #grass {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        width: 80px;
        height: auto;
        cursor: pointer;
        user-select: none;
        -webkit-user-drag: none;
    }
    /* using inset for the first time*/
    #start-screen {
        position: fixed;
        inset: 0;
        /* using z axis to keep the button above the card*/
        z-index: 10;
        display: flex;
        justify-content: center;
        padding: 1rem;
        background: #0000006f;
        align-items: center;
    }

    #start-screen.hidden {
        display: none;
    }

    .start-card {
        /* keeping the start screen slightly smaller than the page*/
        width: 90vw;
        height: 90vh;
        display: flex;
        /*keeping the text and button centered*/
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /*keeping the text slightly higher than the middle*/
        padding: 40vh 2rem 3rem 2.5rem;
        text-align: center;
        background: #ebeae3 url(images/canva_touchgrass_title.png) top center / 100% no-repeat;
        color: #464343;
        border-radius: 12px;
    }

    .start-card p {
        margin: 0 0 1.5rem;
        line-height: 1.5;
    }

    #start-button {
        font-size: 1.1rem;
        padding: 0.6rem 2rem;
        color: #e4dfcf;
        background: #2c8060;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    #timer-area {
        margin: 0 1rem 1rem;
        text-align: center;
        font-size: 1.5rem;
        font-weight: bold;
    }
</style>

<body>
    <div id="start-screen">
        <div class="start-card">
            <p>Move your cursor onto the grass block <br>to <b>"attempt"</b> to ground yourself</p>
            <button id="start-button">START</button>
        </div>
    </div>
    <header>
        <h1>Touch Grass</h1>
        <p>Grass attempts: <span id="attempts">0</span></p>
    </header>

    <main id="play-area">
        <img id="grass" src="images/grass_block.png">
    </main>

    <p id="timer-area">Time left: <span id="timer">15</span>s</p>

    <script>
        const area = document.getElementById("play-area");
        const image = document.getElementById("grass");
        const attemptsnumber = document.getElementById("attempts")
        const timertext = document.getElementById("timer")
        const timelimit = 15
        let attempts = 0;
        let timeleft = timelimit
        let stopgame = false

        function moveImage() {
            // game end screen
            if (stopgame) return;
            // counter increases by 1
            attempts++;
            attemptsnumber.textContent = attempts
            //getting the area's dimensions
            const areaRect = area.getBoundingClientRect();
            // getting the block's dimensions
            const imageWidth = image.offsetWidth;
            const imageHeight = image.offsetHeight;
            //not allowing block to leave the area
            const maxX = Math.max(areaRect.width - imageWidth, 0);
            const maxY = Math.max(areaRect.height - imageHeight, 0);
            //creating a new spawning area
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            // disappear animation
            image.style.opacity = 0;
            image.style.pointerEvents = "none";
            // reappear and movement animations
            setTimeout(() => {
                image.style.opacity = 1;
                image.style.pointerEvents = stopgame ? "none" : "auto";
                image.style.left = `${newX}px`;
                image.style.top = `${newY}px`;
            }, 250);
    }
        image.addEventListener("pointerenter", moveImage);
        // start screen mechanics
        const startScreen = document.getElementById("start-screen")
        const startButton = document.getElementById("start-button")

        //timer mechanics
        function timerstart() {
            const timerId = setInterval(() => {
                timeleft--;
                timertext.textContent = timeleft;

                if (timeleft <= 0) {
                    clearInterval(timerId);
                    stopgame = true
                    image.style.pointerEvents = "none";
                }
            }, 1000);
        }

        startButton.addEventListener("click", () => {
            startScreen.classList.add("hidden");
            timerstart();
        });
    </script>
</body>
