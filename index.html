<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial scale=1.0">
<title>Touch Grass</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        color: #f3ecd2;
        background-color: #2c8060;
        background-image: linear-gradient(
            45deg, #103237 25%, transparent 25%, transparent 75%, #103237 75%, #103237
            ),
            linear-gradient(
            135deg, #103237 25%, transparent 25%, transparent 75%, #103237 75%, #103237
            );
        background-size: 60px 60px;
        background-repeat: repeat;
    }

    header {
        padding: 1rem 1.5rem 0;
        text-align: center;
    }

    h1 {
        margin: 0 0 0.5rem;
    }

    #play-area {
        position: relative;
        min-height: 60vh;
        margin: 1rem;
        border: 4px solid #0f2a1f;
        border-radius: 12px;
        background: #a9c1cf;
        overflow: hidden;
    }

    #grass {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        width: 80px;
        height: auto;
        cursor: pointer;
        user-select: none;
        -webkit-user-drag: none;
    }
</style>

<body>
    <header>
        <h1>touch grass</h1>
        <p>Grass attempts: 0</p>
    </header>

    <main id="play-area">
        <img id="grass" src="images/grass_block.png">
    </main>

    <script>
        const area = document.getElementById("play-area");
        const image = document.getElementById("grass");
        image.addEventListener("pointerenter", moveImage);
    </script>
</body>
