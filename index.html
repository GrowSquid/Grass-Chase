<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial scale=1.0">
<title>Touch Grass</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        color: #895129;
        background: #2c8060;
    }

    header {
        padding: 1rem 1.5rem 0;
    }

    h1 {
        margin: 0 0 0.5rem;
    }

    #area {
        position: relative;
        min-height: 60vh;
        margin: 1rem;
        border: 3px solid rgba(137, 81, 41, 0.5);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
    }

    #grass {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        width: 80px;
        height: auto;
        cursor: pointer;
        transition: left 0.2s ease, top 0.2s ease;
    }
</style>

<body>
    <header>
        <h1>touch grass</h1>
        <p>lorem ipsum</p>
    </header>

    <main id="area">
        <img src="grass_block.png" />
    </main>

    <script>
        const area = document.getElementById("area");
        const image = document.getElementById("grass");

        function moveImage() {
            const areaRect = area.getBoundingClientRect();
            const imageWidth = image.offsetWidth;
            const imageHeight = image.offsetHeight;
            const maxX = Math.max(areaRect.width - imageWidth, 0);
            const maxY = Math.max(areaRect.height - imageHeight, 0);

            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
        }

        image.addEventListener("pointerenter", moveImage);
    </script>
</body>
