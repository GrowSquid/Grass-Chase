<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Touch Grass</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        color: #f3ecd2;
        background-color: #2c8060;
        background-image: linear-gradient(
            45deg, #103237 25%, transparent 25%, transparent 75%, #103237 75%, #103237
            ),
            linear-gradient(
            135deg, #103237 25%, transparent 25%, transparent 75%, #103237 75%, #103237
            );
        background-size: 60px 60px;
        background-repeat: repeat;
    }

    header {
        padding: 1rem 1.5rem 0;
        text-align: center;
    }

    h1 {
        margin: 0 0 0.5rem;
    }

    #play-area {
        position: relative;
        min-height: 60vh;
        margin: 1rem;
        border: 4px solid #0f2a1f;
        border-radius: 12px;
        background: #a9c1cf;
        overflow: hidden;
    }

    #grass {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        width: 80px;
        height: auto;
        cursor: pointer;
        user-select: none;
        -webkit-user-drag: none;
    }
</style>

<body>
    <header>
        <h1>touch grass</h1>
        <p>Grass attempts: <span id="attempts">0</span></p>
    </header>

    <main id="play-area">
        <img id="grass" src="images/grass_block.png">
    </main>

    <script>
        const area = document.getElementById("play-area");
        const image = document.getElementById("grass");
        const attemptsnumber = document.getElementById("attempts")
        let attempts = 0;

        function moveImage() {
            // counter increases by 1
            attempts++;
            attemptsnumber.textContent = attempts
            //getting the area's dimensions
            const areaRect = area.getBoundingClientRect();
            // getting the block's dimensions
            const imageWidth = image.offsetWidth;
            const imageHeight = image.offsetHeight;
            //not allowing block to leave the area
            const maxX = Math.max(areaRect.width - imageWidth, 0);
            const maxY = Math.max(areaRect.height - imageHeight, 0);
            //creating a new spawning area
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            // disappear animation
            image.style.opacity = 0;
            image.style.pointerEvents = "none";
            // reappear and movement animations
            setTimeout(() => {
                image.style.opacity = 1;
                image.style.pointerEvents = "auto";
                image.style.left = `${newX}px`;
                image.style.top = `${newY}px`;
            }, 400);
    }
        image.addEventListener("pointerenter", moveImage);
    </script>
</body>
